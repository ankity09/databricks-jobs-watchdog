# The Watchdog bundle. Values come from accelerator.yaml through
# scripts/bundle_vars.py, for example:
#
#   eval "$(python3 scripts/bundle_vars.py --export accelerator.local.yaml)"
#   databricks bundle deploy -t dev --profile <your-profile>
#   databricks bundle run watchdog_phase_1 -t dev --profile <your-profile>
#
# Targets:
#   dev   the Phase 1 job, the scan job, the daily cleanup job, the Watchdog app and
#         its Lakebase project (default)
#   demo  the same resources plus four sample jobs (one succeeds, one fails, one
#         runs long, one retries), so a fresh workspace has something to watch
#   production  the same resources as dev, in production mode, for a real
#         region; scripts/deploy_regions.py deploys it once per region
#
# The dev and demo targets use development mode, so deployed names carry a
# [dev <you>] prefix. Schedules stay PAUSED unless you set scan_schedule_status
# (the scan and cleanup jobs) or demo_schedule_status to UNPAUSED. Remove
# everything with ./teardown.sh.

bundle:
  name: databricks-jobs-watchdog

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog that holds the Watchdog schema (required)
  schema:
    description: Schema for the Watchdog tables and view
    default: watchdog
  region:
    description: Cloud region of this metastore, recorded on every finding (required)
  lookback_hours:
    description: How far back the system table checks look
    default: "48"
  auth_mode:
    description: current_workspace (this workspace, as the job's identity) or service_principal (every workspace in the region)
    default: current_workspace
  secret_scope:
    description: service_principal mode only, the secret scope holding the OAuth credentials
    default: ""
  client_id_key:
    description: Key in the secret scope holding the service principal's application ID
    default: client_id
  client_secret_key:
    description: Key in the secret scope holding the service principal's OAuth secret
    default: client_secret
  monitored_jobs_path:
    description: Monitored-jobs YAML file; relative paths start at the deployed bundle root
    default: config/monitored_jobs.example.yml
  code_version_tag:
    description: Job tag whose value is the deployed code version
    default: code_version
  pipeline_url_parameter:
    description: Job parameter whose value is the link to the CI pipeline that deployed the job
    default: PIPELINE_URL
  scan_schedule:
    description: Quartz cron for the watchdog_scan job, in UTC (every 20 minutes by default)
    default: "0 0/20 * * * ?"
  scan_schedule_status:
    description: PAUSED (default) or UNPAUSED; UNPAUSED runs watchdog_scan and watchdog_cleanup on their schedules
    default: PAUSED
  retention_days:
    description: watchdog_cleanup deletes findings scans older than this many days, keeping each source's newest scan; 0 keeps everything
    default: "30"
  warehouse_id:
    description: SQL warehouse the Watchdog app reads findings through (required)
  config_source:
    description: Where notebook 02 reads the job list, yaml (the monitored-jobs file) or lakebase (the Watchdog app)
    default: yaml
  app_name:
    description: Name of the Watchdog app; unique in the workspace
    default: watchdog-app
  lakebase_project_id:
    description: Lakebase project that holds the Watchdog app's job list; unique in the workspace
    default: jobs-watchdog
  lakebase_branch:
    description: Lakebase branch the scan reads the job list from
    default: production
  lakebase_database:
    description: Postgres database in that branch
    default: watchdog
  demo_schedule_status:
    description: PAUSED (default) or UNPAUSED; UNPAUSED runs the demo jobs on their schedules
    default: PAUSED

targets:
  dev:
    default: true
    mode: development

  demo:
    mode: development
    resources:
      jobs:
        watchdog_demo_succeeds:
          name: watchdog_demo_succeeds
          description: Sample job for the Watchdog demo. Every run succeeds.
          # tagged the way a CI pipeline tags a deploy, so findings show a code_version
          tags:
            code_version: ${bundle.git.branch}@${bundle.git.commit}
          # and given a PIPELINE_URL parameter, as a CI deploy would (here the repo link stands in
          # for a pipeline link), so findings show a pipeline_url
          parameters:
            - name: PIPELINE_URL
              default: ${bundle.git.origin_url}
          schedule:
            quartz_cron_expression: "0 0 * * * ?"  # hourly
            timezone_id: UTC
            pause_status: ${var.demo_schedule_status}
          tasks:
            - task_key: succeed
              notebook_task:
                notebook_path: ./demo/succeeds.py
        watchdog_demo_fails:
          name: watchdog_demo_fails
          description: Sample job for the Watchdog demo. The load task fails on purpose.
          tags:
            code_version: ${bundle.git.branch}@${bundle.git.commit}
          parameters:
            - name: PIPELINE_URL
              default: ${bundle.git.origin_url}
          schedule:
            quartz_cron_expression: "0 0 0/4 * * ?"  # every 4 hours
            timezone_id: UTC
            pause_status: ${var.demo_schedule_status}
          tasks:
            - task_key: extract
              notebook_task:
                notebook_path: ./demo/succeeds.py
            - task_key: load
              depends_on:
                - task_key: extract
              notebook_task:
                notebook_path: ./demo/fails.py
        watchdog_demo_slow:
          name: watchdog_demo_slow
          description: Sample job for the Watchdog demo. The task waits about three minutes, then succeeds.
          tags:
            code_version: ${bundle.git.branch}@${bundle.git.commit}
          parameters:
            - name: PIPELINE_URL
              default: ${bundle.git.origin_url}
          schedule:
            quartz_cron_expression: "0 30 0/4 * * ?"  # every 4 hours, 30 minutes past the hour
            timezone_id: UTC
            pause_status: ${var.demo_schedule_status}
          tasks:
            - task_key: wait
              notebook_task:
                notebook_path: ./demo/slow.py
        watchdog_demo_retries:
          name: watchdog_demo_retries
          description: Sample job for the Watchdog demo. The task fails twice, then succeeds on its third attempt.
          tags:
            code_version: ${bundle.git.branch}@${bundle.git.commit}
          parameters:
            - name: PIPELINE_URL
              default: ${bundle.git.origin_url}
          schedule:
            quartz_cron_expression: "0 0 0/6 * * ?"  # every 6 hours
            timezone_id: UTC
            pause_status: ${var.demo_schedule_status}
          tasks:
            - task_key: flaky
              max_retries: 2
              min_retry_interval_millis: 10000
              notebook_task:
                notebook_path: ./demo/retries.py
                base_parameters:
                  attempt: "{{task.execution_count}}"

  # One Watchdog per region (see docs/multi-region.md). The workspace host is not
  # set here: a bundle target cannot take its host from a variable. Each region
  # file names its workspace, and scripts/deploy_regions.py passes it as
  # DATABRICKS_HOST (or as a CLI profile). The files go to the deploying
  # identity's own folder, not /Workspace/Shared: production mode warns that a
  # shared path is open to every user, and the fix it suggests (CAN_MANAGE for all
  # users) would reach the jobs, the app and the copilot too.
  production:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
