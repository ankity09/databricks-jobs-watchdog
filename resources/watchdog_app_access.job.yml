# Gives the Watchdog app's service principal access to the job list it keeps in
# Lakebase (notebook 11). Needed after a plain teardown and a new deploy: the
# new app has a new service principal, and the kept list belongs to the
# identity that ran the teardown. The job runs as the deploying identity and
# changes nothing when the app already has access, so scripts/deploy_regions.py
# runs it after each region's deploy. It has no schedule. The one task runs on
# serverless compute and installs psycopg from PyPI (or your package mirror).
resources:
  jobs:
    watchdog_app_access:
      name: watchdog_app_access
      description: "Watchdog: give the app's service principal access to its job list in Lakebase, after a teardown and a new deploy"
      max_concurrent_runs: 1
      parameters:
        - name: app_name
          default: ${var.app_name}
        - name: lakebase_project_id
          default: ${var.lakebase_project_id}
        - name: lakebase_branch
          default: ${var.lakebase_branch}
        - name: lakebase_database
          default: ${var.lakebase_database}
      tasks:
        - task_key: grant_app_access
          notebook_task:
            notebook_path: ../notebooks/11_grant_app_access.py
