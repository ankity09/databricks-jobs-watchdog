      #   - job_cluster_key: custom_checks
      #     new_cluster:
      #       policy_id: "<your-cluster-policy-id>"
      #       spark_version: "<databricks-runtime-version>"
      #       node_type_id: "<node-type-id>"
      #       num_workers: 1
