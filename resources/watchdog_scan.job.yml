# Scheduled scan: the system table scan and the Jobs API scan, on a timer.
#
# Each run first brings the Watchdog tables up to date (notebook 01: creates
# what is missing, adds new columns after an upgrade, and leaves current
# tables and views alone), then reloads the config file and runs both scans.
# Run watchdog_phase_1 once first, to check access and validate the setup.
#
# Starts PAUSED, so nothing runs on a timer. To turn the schedule on, set
# scan.schedule_status to UNPAUSED in accelerator.local.yaml, or pass
# --var scan_schedule_status=UNPAUSED. The schedule is in UTC.
#
# Every task runs on serverless compute. The commented task at the end runs a
# custom check on a job cluster instead, for services that serverless compute
# cannot reach.
resources:
  jobs:
    watchdog_scan:
      name: watchdog_scan
      description: "Watchdog scan on a schedule: system table and Jobs API findings"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: ${var.scan_schedule}
        timezone_id: UTC
        pause_status: ${var.scan_schedule_status}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: region
          default: ${var.region}
        - name: lookback_hours
          default: ${var.lookback_hours}
        - name: scan_id
          default: "{{job.run_id}}"
        - name: auth_mode
          default: ${var.auth_mode}
        - name: secret_scope
          default: ${var.secret_scope}
        - name: client_id_key
          default: ${var.client_id_key}
        - name: client_secret_key
          default: ${var.client_secret_key}
        - name: monitored_jobs_path
          default: ${var.monitored_jobs_path}
        - name: code_version_tag
          default: ${var.code_version_tag}
      tasks:
        - task_key: create_tables
          notebook_task:
            notebook_path: ../notebooks/01_create_tables.py
        - task_key: load_config
          depends_on:
            - task_key: create_tables
          notebook_task:
            notebook_path: ../notebooks/02_load_config.py
        - task_key: scan_system_tables
          depends_on:
            - task_key: load_config
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../notebooks/05_scan_system_tables.py
        - task_key: scan_jobs_api
          depends_on:
            - task_key: scan_system_tables
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../notebooks/06_scan_jobs_api.py
        # Optional: a custom check on its own job cluster (see notebook 09).
        # To use it, uncomment this task and the job_clusters block below, and set
        # policy_id to a cluster policy whose network can reach the services.
        # - task_key: custom_checks
        #   job_cluster_key: custom_checks
        #   depends_on:
        #     - task_key: scan_jobs_api
        #   run_if: ALL_DONE
        #   notebook_task:
        #     notebook_path: ../notebooks/09_custom_check_example.py
