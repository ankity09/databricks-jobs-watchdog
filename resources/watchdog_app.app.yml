# The Watchdog app. bundle deploy creates or updates it; bundle run watchdog_app
# deploys the code and starts it. Queries and the Genie copilot run as the person
# signed in (the sql and dashboards.genie user scopes); Lakebase and Scan now
# run as the app.
resources:
  apps:
    watchdog_app:
      name: ${var.app_name}
      description: "Watchdog: job monitoring, the monitored-jobs list and a read-only copilot"
      source_code_path: ../app
      user_api_scopes:
        - sql
        - dashboards.genie
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: ${resources.postgres_projects.watchdog_db.name}/branches/${var.lakebase_branch}
            database: ${resources.postgres_databases.watchdog_database.name}
            permission: CAN_CONNECT_AND_CREATE
        - name: job
          job:
            id: ${resources.jobs.watchdog_scan.id}
            permission: CAN_MANAGE_RUN
        - name: genie-space
          genie_space:
            name: watchdog-copilot
            space_id: ${resources.genie_spaces.watchdog_copilot.id}
            permission: CAN_RUN
